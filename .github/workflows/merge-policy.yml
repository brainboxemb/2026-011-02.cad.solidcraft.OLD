name: Merge policy

# GitHub repositories must enable both squash and normal merge commits because
# this repository needs two different histories:
# - short-lived work -> dev lane: squash;
# - dev-cad/dev-ci -> main: normal merge commit.
# Do not choose that method manually. The owner-only /merge command below
# resolves it from scripts/merge_policy.py and merges the exact checked SHA.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  merge:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/merge' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    concurrency:
      group: merge-policy-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      statuses: read
      actions: write
    steps:
      - name: Checkout merge policy from the trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/merge_policy.py
          sparse-checkout-cone-mode: false

      - name: Merge through repository policy
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          refuse() {
            reason="$1"
            echo "merge refused: $reason" >&2
            gh api -X POST               "repos/$REPOSITORY/issues/$PR_NUMBER/comments"               -f body="Merge refused by repository policy: $reason"               >/dev/null
            exit 1
          }

          # Read the PR again at command execution time. The comment event may
          # be older than the current head and must never authorize a stale SHA.
          PR_JSON="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          STATE="$(jq -r '.state' <<<"$PR_JSON")"
          DRAFT="$(jq -r '.draft' <<<"$PR_JSON")"
          MERGEABLE="$(jq -r 'if .mergeable == null then "unknown" else (.mergeable|tostring) end' <<<"$PR_JSON")"
          BASE_REF="$(jq -r '.base.ref' <<<"$PR_JSON")"
          HEAD_REF="$(jq -r '.head.ref' <<<"$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          HEAD_REPO="$(jq -r '.head.repo.full_name // ""' <<<"$PR_JSON")"

          [ "$STATE" = "open" ] || refuse "pull request is not open"
          [ "$DRAFT" = "false" ] || refuse "pull request is still a draft"
          [ "$MERGEABLE" = "true" ] || refuse "pull request is not currently mergeable ($MERGEABLE)"

          # Require the latest run of every check name on the exact PR head to
          # be complete and green. Older successful runs cannot mask a newer
          # failure with the same check name.
          CHECKS_JSON="$(
            gh api               -H "Accept: application/vnd.github+json"               "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100"
          )"
          LATEST_CHECKS="$(
            jq -c '
              [.check_runs[]]
              | sort_by(.name, (.started_at // ""), .id)
              | group_by(.name)
              | map(last)
            ' <<<"$CHECKS_JSON"
          )"
          CHECK_COUNT="$(jq -r 'length' <<<"$LATEST_CHECKS")"
          [ "$CHECK_COUNT" -gt 0 ] || refuse "no completed PR checks exist on the current head"

          BAD_CHECKS="$(
            jq -r '
              [
                .[]
                | select(
                    .status != "completed"
                    or (
                      .conclusion != "success"
                      and .conclusion != "neutral"
                      and .conclusion != "skipped"
                    )
                  )
                | .name + "=" + .status + "/" + (.conclusion // "none")
              ]
              | join(", ")
            ' <<<"$LATEST_CHECKS"
          )"
          [ -z "$BAD_CHECKS" ] || refuse "checks are not green: $BAD_CHECKS"

          STATUS_JSON="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/status")"
          STATUS_COUNT="$(jq -r '.statuses | length' <<<"$STATUS_JSON")"
          STATUS_STATE="$(jq -r '.state' <<<"$STATUS_JSON")"
          if [ "$STATUS_COUNT" -gt 0 ] && [ "$STATUS_STATE" != "success" ]; then
            refuse "commit status contexts are not green ($STATUS_STATE)"
          fi

          POLICY="$(
            python scripts/merge_policy.py               --base "$BASE_REF"               --head "$HEAD_REF"
          )"
          METHOD="$(jq -r '.merge_method' <<<"$POLICY")"
          DIRECT_PROMOTION="$(jq -r '.direct_lane_promotion' <<<"$POLICY")"
          CLEANUP_HEAD="$(jq -r '.cleanup_head' <<<"$POLICY")"
          INTEGRATE_BASE="$(jq -r '.integrate_base' <<<"$POLICY")"

          if [ "$DIRECT_PROMOTION" = "true" ] && [ "$HEAD_REPO" != "$REPOSITORY" ]; then
            refuse "long-lived lane promotion must originate from this repository"
          fi

          echo "base=$BASE_REF"
          echo "head=$HEAD_REF"
          echo "head_sha=$HEAD_SHA"
          echo "merge_method=$METHOD"
          echo "direct_lane_promotion=$DIRECT_PROMOTION"
          echo "cleanup_head=$CLEANUP_HEAD"
          echo "integrate_base=$INTEGRATE_BASE"

          MERGE_JSON="$(
            gh api -X PUT               "repos/$REPOSITORY/pulls/$PR_NUMBER/merge"               -f sha="$HEAD_SHA"               -f merge_method="$METHOD"
          )"
          MERGED="$(jq -r '.merged' <<<"$MERGE_JSON")"
          [ "$MERGED" = "true" ] || refuse "GitHub declined merge: $(jq -r '.message' <<<"$MERGE_JSON")"
          MERGE_SHA="$(jq -r '.sha' <<<"$MERGE_JSON")"

          # Direct lane promotion deliberately keeps the long-lived lane and
          # advances it to the new main merge commit. This prevents dev-ci or
          # dev-cad from remaining behind main immediately after promotion.
          LIFECYCLE_RESULT="not-requested"
          if [ "$DIRECT_PROMOTION" = "true" ]; then
            sleep 1
            if gh api "repos/$REPOSITORY/git/ref/heads/$HEAD_REF" >/dev/null 2>&1; then
              gh api -X PATCH                 "repos/$REPOSITORY/git/refs/heads/$HEAD_REF"                 -f sha="$MERGE_SHA"                 -F force=false                 >/dev/null
              LIFECYCLE_RESULT="long-lived lane advanced to merge commit"
            else
              gh api -X POST                 "repos/$REPOSITORY/git/refs"                 -f ref="refs/heads/$HEAD_REF"                 -f sha="$MERGE_SHA"                 >/dev/null
              LIFECYCLE_RESULT="long-lived lane recreated at merge commit"
            fi
          elif [ "$CLEANUP_HEAD" = "true" ] && [ "$HEAD_REPO" = "$REPOSITORY" ]; then
            if gh api "repos/$REPOSITORY/git/ref/heads/$HEAD_REF" >/dev/null 2>&1; then
              gh api -X DELETE                 "repos/$REPOSITORY/git/refs/heads/$HEAD_REF"                 >/dev/null
              LIFECYCLE_RESULT="temporary head deleted"
            else
              LIFECYCLE_RESULT="temporary head already absent"
            fi
          fi

          # Merges made by this workflow use GITHUB_TOKEN, so GitHub does not
          # emit another workflow run from the resulting branch update. Dispatch
          # the accepted durable source ref explicitly, matching Forge policy.
          DISPATCHED=()
          if [ "$INTEGRATE_BASE" = "true" ]; then
            gh api -X POST               "repos/$REPOSITORY/actions/workflows/cad.yml/dispatches"               -f ref="$BASE_REF"               >/dev/null
            DISPATCHED+=("$BASE_REF")
          fi
          if [ "$DIRECT_PROMOTION" = "true" ]; then
            gh api -X POST               "repos/$REPOSITORY/actions/workflows/cad.yml/dispatches"               -f ref="$HEAD_REF"               >/dev/null
            DISPATCHED+=("$HEAD_REF")
          fi

          if [ "${#DISPATCHED[@]}" -gt 0 ]; then
            INTEGRATION_RESULT="$(IFS=', '; echo "${DISPATCHED[*]}")"
          else
            INTEGRATION_RESULT="none"
          fi

          COMMENT_BODY="$(
            printf 'Merged by repository policy: `%s -> %s` using **%s** at `%s`. Branch lifecycle: %s. Integration dispatched: %s.'               "$HEAD_REF" "$BASE_REF" "$METHOD" "$MERGE_SHA" "$LIFECYCLE_RESULT" "$INTEGRATION_RESULT"
          )"
          gh api -X POST             "repos/$REPOSITORY/issues/$PR_NUMBER/comments"             -f body="$COMMENT_BODY"             >/dev/null
