name: CAD

on:
  pull_request:
    branches: [main, dev-cad, dev-ci]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Models to check
        type: choice
        required: true
        default: changed
        options: [changed, models, all]
      models:
        description: Model slugs when mode is models
        type: string
        required: false
        default: ""

permissions:
  contents: write
  packages: read

concurrency:
  group: cad-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  architecture:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      (github.event.pull_request.base.ref == 'dev-cad' ||
       github.event.pull_request.base.ref == 'dev-ci')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check model catalog and website route contracts
        run: python -m unittest discover -s tests -p test_ci_migration_contract.py -v
      - name: Check branch merge policy
        run: python -m unittest discover -s tests -p test_merge_policy.py -v
      - name: Exercise existing CAD website layout and link generation
        run: python -m unittest discover -s tests -p test_site_generation.py -v
      - name: Check generic CAD model producer and model ownership
        run: python -m unittest discover -s tests -p test_model_verify_runner.py -v

  released_cad_models:
    # This is a development-branch proof only, with no durable publication.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.base.ref == 'dev-ci'
    needs: architecture
    permissions:
      contents: read
      packages: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Build and verify selected SolidCraft models
        uses: brainboxemb/tool.cad.ci@1012e6a539a2fddd8194124844fe208bf16cf4e4
        with:
          source_sha: ${{ github.event.pull_request.head.sha }}
          base_sha: ${{ github.event.pull_request.base.sha }}
          full_run: ${{ github.event.pull_request.base.ref == 'main' && (github.event.pull_request.head.ref == 'dev-cad' || github.event.pull_request.head.ref == 'dev-ci') }}
          jobs: "2"
          github_token: ${{ github.token }}

  cad:
    # Keep the accepted main CAD pipeline untouched during migration.
    # Development PRs run only the lightweight structural contract checks
    # until their Forge-style CAD-CI graph is fully connected.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'closed' && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    env:
      BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'changed' }}
      BUILD_MODELS: ${{ github.event_name == 'workflow_dispatch' && inputs.models || '' }}
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.head_ref || github.ref_name }}
      PR_NUMBER: ${{ github.event.pull_request.number || 0 }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Publication checks the real source commit, not GitHub's temporary
          # PR merge ref.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Checkout verified build output
        uses: actions/checkout@v4
        with:
          ref: build
          path: generated-build
          fetch-depth: 0

      - name: Checkout current Pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap pinned CAD dependencies
        run: python scripts/ci/bootstrap_cad_ci.py

      - name: Install pinned publication tool on host
        run: python -m pip install -e ext/cad-ci

      - name: Resolve released SolidCraft runtime
        id: runtime
        run: python scripts/ci/cad_runtime.py --github-output "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull released SolidCraft runtime
        run: docker pull "${{ steps.runtime.outputs.reference }}"

      - name: Run selected CAD pipeline
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e BUILD_MODE \
            -e BUILD_MODELS \
            -e BASE_SHA \
            -e HEAD_SHA \
            -e EVENT_NAME \
            -e REF_NAME \
            -e PR_NUMBER \
            -e GITHUB_RUN_ID \
            -e PYTHONPATH="/workspace/ext/scpf/scpf:/workspace/ext/scpc/src" \
            -e SCPF_COMMIT="${{ steps.runtime.outputs.scpf_sha }}" \
            -e SCPC_COMMIT="${{ steps.runtime.outputs.scpc_sha }}" \
            -e SCPF_RELEASE="${{ steps.runtime.outputs.scpf_release }}" \
            "${{ steps.runtime.outputs.reference }}" \
            python scripts/ci/pipeline_ci.py \
              --mode "$BUILD_MODE" \
              --models "$BUILD_MODELS" \
              --base-sha "$BASE_SHA" \
              --head-sha "$HEAD_SHA" \
              --event-name "$EVENT_NAME" \
              --ref-name "$REF_NAME" \
              --pull-request "$PR_NUMBER" \
              --out output \
              --build-root generated-build \
              --previous-site pages \
              --workflow-run "$GITHUB_RUN_ID" \
              --image-reference "${{ steps.runtime.outputs.reference }}"

      - name: Publish verified build and site
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python scripts/ci/publish_ci.py \
            --bundle output \
            --source-root . \
            --build-root generated-build \
            --pages-root pages \
            --workflow-event "$EVENT_NAME" \
            --workflow-head-branch "$REF_NAME" \
            --workflow-head-sha "$HEAD_SHA" \
            --pull-request "$PR_NUMBER"

      - name: Upload CAD diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-${{ github.run_id }}
          path: |
            output/plan.json
            output/tool-cad-ci-plan.json
            output/models/
            output/native/
            output/candidate/
            publication-output/
            build/models/**
          if-no-files-found: ignore

  cleanup:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted cleanup code
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap pinned CAD dependencies
        run: python source/scripts/ci/bootstrap_cad_ci.py

      - name: Install pinned publication tool on host
        run: python -m pip install -e source/ext/cad-ci

      - name: Remove closed PR output
        run: |
          python source/scripts/ci/cleanup_ci.py \
            --source-root source \
            --pull-request "${{ github.event.pull_request.number }}"
