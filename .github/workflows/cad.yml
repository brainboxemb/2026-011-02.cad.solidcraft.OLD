name: CAD

on:
  pull_request:
    branches: [main, dev-cad, dev-ci]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev-cad, dev-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository_contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model.yml reader
        run: python -m pip install -r requirements-site.txt
      - name: Check CAD repository contracts
        run: |
          python -m unittest discover -s tests -p test_ci_migration_contract.py -v
          python -m unittest discover -s tests -p test_model_metadata.py -v
          python -m unittest discover -s tests -p test_merge_policy.py -v
          python -m unittest discover -s tests -p test_site_generation.py -v
          python -m unittest discover -s tests -p test_model_verify_runner.py -v
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Set up pinned Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true
      - name: Build model.yml site without claiming build evidence
        env:
          HUGO_BASEURL: https://brainboxemb.github.io/2026-011-02.cad.solidcraft/previews/pr-${{ github.event.pull_request.number }}/
          HUGO_PARAMS_SOURCEREF: ${{ github.event.pull_request.head.sha }}
          HUGO_PARAMS_BUILDSCOPE: pr
        run: |
          mkdir -p prepared-scope
          cd site
          hugo mod graph | grep -F "github.com/nunocoracao/blowfish/v3@v3.10.0"
          hugo --minify --printPathWarnings --destination "$GITHUB_WORKSPACE/generated-site"
          cd "$GITHUB_WORKSPACE"
          test -s generated-site/models/plate/index.html
          test -s generated-site/models/guide-rail-makita/index.html
          test -s generated-site/models/simple-mft-assembly/index.html
          test -s generated-site/models/basic/index.html
          test -s generated-site/models/components/index.html
          test -s generated-site/models/advanced/index.html
          grep -F "No build evidence in this scope" generated-site/models/plate/index.html

  cad_ci_pr:
    if: github.event_name == 'pull_request'
    needs: repository_contract
    permissions:
      contents: read
      packages: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Run exact Forge-qualified CAD-CI release
        uses: brainboxemb/tool.cad.ci@b62f9d0b169aa201a3c66c3166f364396b2d71bc
        with:
          source_sha: ${{ github.event.pull_request.head.sha }}
          base_sha: ${{ github.event.pull_request.base.sha }}
          full_run: ${{ github.event.pull_request.base.ref == 'main' && (github.event.pull_request.head.ref == 'dev-cad' || github.event.pull_request.head.ref == 'dev-ci') }}
          jobs: "2"
          github_token: ${{ github.token }}

  cad_ci_push:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    concurrency:
      group: cad-push-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Validate durable source lane
        env:
          SOURCE_SCOPE: ${{ github.ref_name }}
        run: |
          case "$SOURCE_SCOPE" in
            main|dev-cad|dev-ci) ;;
            *) echo "unsupported durable source branch: $SOURCE_SCOPE" >&2; exit 2 ;;
          esac
      - name: Run and publish durable CAD-CI scope
        id: cad_ci
        uses: brainboxemb/tool.cad.ci@b62f9d0b169aa201a3c66c3166f364396b2d71bc
        with:
          source_sha: ${{ github.sha }}
          durable_scope: ${{ github.ref_name }}
          source_ref: ${{ github.ref_name }}
          jobs: "2"
          github_token: ${{ github.token }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Set up pinned Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true
      - name: Build CAD Pages from the complete accepted scope
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILD_COMMIT: ${{ steps.cad_ci.outputs.build_commit }}
          SCOPE: ${{ steps.cad_ci.outputs.scope }}
          PREPARED_SCOPE: ${{ steps.cad_ci.outputs.prepared_scope }}
        run: |
          test -d "$PREPARED_SCOPE"
          test "$(realpath "$PREPARED_SCOPE")" = "$(realpath prepared-scope)"
          if [ "$SCOPE" = "main" ]; then
            base_url="https://brainboxemb.github.io/2026-011-02.cad.solidcraft/"
          else
            base_url="https://brainboxemb.github.io/2026-011-02.cad.solidcraft/$SCOPE/"
          fi
          export HUGO_BASEURL="$base_url"
          export HUGO_PARAMS_SOURCEREF="$SOURCE_SHA"
          export HUGO_PARAMS_BUILDSCOPE="$SCOPE"
          export HUGO_PARAMS_BUILDCOMMIT="$BUILD_COMMIT"
          cd site
          hugo mod graph | grep -F "github.com/nunocoracao/blowfish/v3@v3.10.0"
          hugo --minify --printPathWarnings --destination "$GITHUB_WORKSPACE/generated-site"
          cd "$GITHUB_WORKSPACE"
          jq -n --arg source "$SOURCE_SHA" --arg build "$BUILD_COMMIT" --arg scope "$SCOPE"             '{schema:1,generator:"hugo+blowfish",source_commit:$source,build_commit:$build,build_scope:$scope}'             > generated-site/provenance.json
          require_file() {
            if [ ! -s "$1" ]; then
              echo "missing generated Pages file: $1" >&2
              find generated-site/models -maxdepth 3 -type f | sort >&2
              exit 1
            fi
          }
          require_file generated-site/models/plate/index.html
          require_file generated-site/models/plate/model.yml
          require_file generated-site/models/plate/model.png
          require_file generated-site/models/plate/model.sc
          require_file generated-site/models/plate/model.step
          require_file generated-site/models/plate/provenance.json
          require_file generated-site/models/plate/solidcraft.json
          require_file generated-site/models/guide-rail-makita/index.html
          require_file generated-site/models/simple-mft-assembly/index.html
          jq -e --arg source "$SOURCE_SHA" '.source_commit == $source' generated-site/provenance.json >/dev/null
          jq -e --arg build "$BUILD_COMMIT" '.build_commit == $build' generated-site/provenance.json >/dev/null
          jq -e --arg scope "$SCOPE" '.build_scope == $scope' generated-site/provenance.json >/dev/null
      - name: Publish CAD Pages for source scope
        env:
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          SCOPE: ${{ steps.cad_ci.outputs.scope }}
        run: |
          if [ "$SCOPE" = "main" ]; then
            page_args=(--preserve-subtree dev-cad --preserve-subtree dev-ci)
          else
            page_args=(--name "$SCOPE")
          fi
          python -m cad_ci_tool publish pages             --repo .             --site generated-site             "${page_args[@]}"             --message "pages: $SCOPE $SOURCE_SHA"             --source-ref "$SOURCE_REF"             --expected-source "$SOURCE_SHA"
