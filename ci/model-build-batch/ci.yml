# The released CAD-CI stack scans/plans; this producer executes one SolidCraft batch.
id: model-build-batch
process: true
kind: verification
needs: [forge-package, scpc-package, cad-verification-package]
watch:
  - cad-ci.yml
  - dependencies.repos
  - ci/toolchain.json
  - ci/cad-verification-package/package.json
  - models/*/*/ci.yml
  - models/*/*/scpf/**
  - models/*/*/scpc/**
  - models/*/*/verification/**
  - models/*/*/check.py
  - scripts/ci/model_build_batch.py
  - scripts/ci/model_verify.py
  - scripts/ci/model_catalog.py
  - scripts/ci/model_checks.py
strategy:
  reuse: true
steps:
  - id: build_models
    selection_context: direct_dependents
    inputs:
      - cad-ci.yml
      - dependencies.repos
      - ci/toolchain.json
      - ci/cad-verification-package/package.json
      - models/*/*/ci.yml
      - models/*/*/scpf/**
      - models/*/*/scpc/**
      - models/*/*/verification/**
      - models/*/*/check.py
      - scripts/ci/model_build_batch.py
      - scripts/ci/model_verify.py
      - scripts/ci/model_catalog.py
      - scripts/ci/model_checks.py
    run: [python, ../../scripts/ci/model_build_batch.py]
    outputs: [items, manifest.json, batch-report.json]
