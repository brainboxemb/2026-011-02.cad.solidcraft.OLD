# Forge-compatible shared model-build graph. Public Pages remain unchanged.
schema: 1
variables:
  FORGE_RUNTIME_IMAGE: "ghcr.io/brainboxemb/cad-solidcraft:v0.3.4"
  SOLIDCRAFT_VERSION: "0.45.0"
templates:
  cad-model-build:
    kind: model
    needs: [model-build-batch]
    watch:
      item: [ci.yml, scpf/**, scpc/**, verification/**, check.py, basic/scpf/**, basic/scpc/**, basic/verification/**, basic/check.py, detailed/scpf/**, detailed/scpc/**, detailed/verification/**, detailed/check.py]
      repo: [dependencies.repos, ci/toolchain.json, scripts/ci/model_build_batch.py, scripts/ci/model_verify.py, scripts/ci/model_catalog.py, scripts/ci/model_checks.py]
    strategy:
      reuse: true
    steps:
      - id: build_results
        copy:
          dependency: model-build-batch
          source: items/{item_path}
        outputs: [generated, models, manifest.json]
items:
  - ci/*
  - models/basic/*
  - models/components/*
  - models/advanced/*
